<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 3 Libri Chiusi -->
    <g transform="translate(110, 45) scale(0.68)">
      <!-- Libro 1 (Sinistra) -->
      <rect x="20" y="40" width="100" height="340" rx="22" fill="none" stroke="#000000" stroke-width="44" />
      <line x1="20" y1="120" x2="120" y2="120" stroke="#000000" stroke-width="44" />
      <line x1="20" y1="310" x2="120" y2="310" stroke="#000000" stroke-width="44" />
      
      <!-- Libro 2 (Centro) -->
      <rect x="150" y="40" width="100" height="340" rx="22" fill="none" stroke="#000000" stroke-width="44" />
      <line x1="150" y1="120" x2="250" y2="120" stroke="#000000" stroke-width="44" />
      <line x1="150" y1="310" x2="250" y2="310" stroke="#000000" stroke-width="44" />
      
      <!-- Libro 3 (Inclinato a Destra) -->
      <g transform="translate(320, 210) rotate(18) translate(-320, -210)">
        <rect x="270" y="40" width="100" height="340" rx="22" fill="none" stroke="#000000" stroke-width="44" />
        <line x1="270" y1="120" x2="370" y2="120" stroke="#000000" stroke-width="44" />
        <line x1="270" y1="310" x2="370" y2="310" stroke="#000000" stroke-width="44" />
      </g>
    </g>

    <!-- Nota Musicale (Basso a Sinistra) -->
    <g transform="translate(100, 340) scale(0.25)">
      <ellipse cx="100" cy="360" rx="60" ry="45" fill="#000000" stroke="none" transform="rotate(-15 100 360)" />
      <ellipse cx="260" cy="360" rx="60" ry="45" fill="#000000" stroke="none" transform="rotate(-15 260 360)" />
      <path d="M 145 340 L 145 120 L 305 120 L 305 340" stroke="#000000" stroke-width="48" stroke-linecap="square" />
      <line x1="145" y1="180" x2="305" y2="180" stroke="#000000" stroke-width="48" />
    </g>

    <!-- Tasto Play Video (Basso a Destra) -->
    <g transform="translate(350, 400)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#000000" stroke-width="32" />
      <polygon points="-10,-22 20,0 -10,22" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round" />
    </g>

  </g>
</svg>